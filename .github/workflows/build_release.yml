name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Licenses & Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "ndk;28.2.13676358" > /dev/null 2>&1 || true

      - name: Patch Package Name
        run: |
          sed -i -E 's/applicationId\s*=\s*".*?"/applicationId = "df.D10slice"/' app/build.gradle.kts || true
          sed -i -E 's/namespace\s*=\s*".*?"/namespace = "df.D10slice"/' app/build.gradle.kts || true

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Sign APK with apksigner (v1, v2, v3)
        run: |
          keytool -genkeypair -v -keystore release.jks -alias dslice -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass dslice123 -keypass dslice123 -dname "CN=Dslice, OU=Dev, O=App, C=US"
          
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          RAW_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          
          "$BUILD_TOOLS/zipalign" -p -f 4 "$RAW_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-key-alias dslice \
            --ks-pass pass:dslice123 \
            --key-pass pass:dslice123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Dslice_6.2_Signed.apk \
            aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Dslice_Signed_APK
          path: Dslice_6.2_Signed.apk
          if-no-files-found: error
